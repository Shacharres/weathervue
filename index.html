<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherVue</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>WeatherVue</h1>
      <p class="subtitle">Maybe on average the prediction will be right...</p>

      <form id="search-form">
        <input
          type="text"
          id="search-input"
          placeholder="Enter a city or area name..."
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>

      <ul id="candidates" class="candidates-list"></ul>

      <p id="resolved-location" class="location-header"></p>

      <p id="status" class="status-message" role="status"></p>

      <div id="chart-legend" class="chart-legend"></div>

      <div class="tabs">
        <button class="tab-button active" data-tab="short-term">30 Hour Forecast</button>
        <button class="tab-button" data-tab="long-term">7 Day Forecast</button>
      </div>

      <div id="short-term" class="tab-content active">
        <div id="chart-temperature-short" class="chart-container"></div>
        <div id="chart-apparent-short" class="chart-container"></div>
        <div id="chart-precipitation-short" class="chart-container"></div>
        <div id="chart-wind-short" class="chart-container"></div>
      </div>

      <div id="long-term" class="tab-content">
        <div id="chart-temperature-long" class="chart-container"></div>
        <div id="chart-apparent-long" class="chart-container"></div>
        <div id="chart-precipitation-long" class="chart-container"></div>
        <div id="chart-wind-long" class="chart-container"></div>
      </div>

      <p class="footnote">
        Some models may not provide data for every location.
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
